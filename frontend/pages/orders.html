<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Orders - ShopEasy</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="../index.html" class="logo">Shop<span>Easy</span></a>
      <nav class="nav-actions">
        <a href="orders.html" id="ordersLink" class="hidden">My Orders</a>
        <a href="admin.html" id="adminLink" class="hidden">Admin</a>
        <button id="authBtn" class="btn-link">Login</button>
        <span id="userGreeting" class="hidden"></span>
        <button id="logoutBtn" class="btn-link hidden">Logout</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2 class="page-title">My Orders</h2>
    <div id="ordersContainer" class="table-wrap"></div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    async function loadMyOrders() {
      const container = document.getElementById('ordersContainer');
      if (!Auth.isLoggedIn()) {
        container.innerHTML = '<p class="empty-state">Please login to view your orders.</p>';
        return;
      }
      try {
        const res = await api.getMyOrders();
        if (res.data.length === 0) {
          container.innerHTML = '<p class="empty-state">You haven\'t placed any orders yet.</p>';
          return;
        }
        container.innerHTML = `
          <table>
            <thead>
              <tr><th>Order ID</th><th>Items</th><th>Total</th><th>Status</th><th>Placed On</th></tr>
            </thead>
            <tbody>
              ${res.data
                .map(
                  (o) => `
                <tr>
                  <td>${o._id.slice(-8)}</td>
                  <td>${o.items.map((i) => `${i.name} x${i.quantity}`).join(', ')}</td>
                  <td>$${o.totalAmount.toFixed(2)}</td>
                  <td><span class="badge ${o.status}">${o.status}</span></td>
                  <td>${new Date(o.createdAt).toLocaleDateString()}</td>
                </tr>`
                )
                .join('')}
            </tbody>
          </table>`;
      } catch (err) {
        container.innerHTML = `<p class="empty-state">Failed to load orders: ${err.message}</p>`;
      }
    }
    document.addEventListener('DOMContentLoaded', loadMyOrders);
  </script>
</body>
</html>
